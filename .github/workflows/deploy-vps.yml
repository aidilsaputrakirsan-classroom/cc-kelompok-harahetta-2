name: CD — Deploy ke VPS Pribadi

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ke VPS via SSH
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== MEMULAI DEPLOYMENT KE VPS ==="
            
            # 1. Masuk ke folder aplikasi
            if [ -d "$HOME/app" ]; then
              cd "$HOME/app"
            else
              echo "Folder $HOME/app tidak ditemukan! Menggunakan directory default."
              exit 1
            fi
            
            echo "Direktori saat ini: $(pwd)"
            
            # 2. Fetch update terbaru tanpa menggabungkannya dahulu
            echo "Mengambil info terbaru dari GitHub..."
            git fetch origin main
            
            # 3. Deteksi perubahan sebelum melalukan pull
            # Cek apakah backend/requirements.txt berubah
            REQUIREMENTS_CHANGED=$(git diff --name-only HEAD origin/main | grep "backend/requirements.txt" || true)
            # Cek apakah ada file dalam folder frontend/ yang berubah
            FRONTEND_CHANGED=$(git diff --name-only HEAD origin/main | grep "^frontend/" || true)
            
            # 4. Pull update dari main
            echo "Melakukan git pull..."
            git pull origin main
            
            # 5. Install dependency backend (kalau ada perubahan requirements.txt)
            if [ -n "$REQUIREMENTS_CHANGED" ]; then
              echo "Ditemukan perubahan pada backend/requirements.txt. Menginstall dependencies..."
              if [ -f "backend/venv/bin/activate" ]; then
                source backend/venv/bin/activate
                pip install -r backend/requirements.txt
                deactivate
                echo "Dependencies backend berhasil diupdate."
              else
                echo "Virtual environment backend/venv tidak ditemukan! Lewati instalasi pip."
              fi
            else
              echo "Tidak ada perubahan pada backend/requirements.txt. Lewati instalasi pip."
            fi
            
            # 6. Build frontend (karena ada perubahan di folder frontend)
            if [ -n "$FRONTEND_CHANGED" ]; then
              echo "Ditemukan perubahan pada frontend. Melakukan build..."
              if [ -d "frontend" ]; then
                cd frontend
                npm install
                npm run build
                cd ..
                echo "Build frontend selesai."
              else
                echo "Folder frontend tidak ditemukan!"
              fi
            else
              echo "Tidak ada perubahan pada folder frontend. Lewati build frontend."
            fi
            
            # 7. Restart Services (Opsional)
            # Jika Anda menjalankan backend menggunakan Uvicorn via Systemd / PM2,
            # silakan uncomment salah satu command di bawah ini sesuai kebutuhan Anda:
            # sudo systemctl restart fastapi-backend
            # pm2 restart app
            
            echo "=== DEPLOYMENT VPS SELESAI ==="
