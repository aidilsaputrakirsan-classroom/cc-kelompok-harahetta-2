name: "CD — Deploy Manual ke VPS"

# ============================================================
# TRIGGER: HANYA manual (workflow_dispatch)
# Push ke main TIDAK otomatis deploy ke VPS ini.
# Cara deploy: GitHub → Actions → "CD — Deploy Manual ke VPS" → Run workflow
# ============================================================
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "🔨 Paksa docker compose build ulang semua image"
        type: boolean
        default: false
      target_branch:
        description: "Branch yang akan di-deploy (default: main)"
        type: string
        default: "main"
      skip_migrate:
        description: "⏭ Skip migrasi database (khusus darurat)"
        type: boolean
        default: false

concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false   # Jangan batalkan deploy yang sedang jalan

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  STEP 1 — Validasi input & persiapan
  # ─────────────────────────────────────────────────────────────────
  prepare:
    name: "🔍 Prepare"
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.info.outputs.branch }}
      force_rebuild: ${{ steps.info.outputs.force_rebuild }}
      skip_migrate: ${{ steps.info.outputs.skip_migrate }}

    steps:
      - name: Cek secrets wajib tersedia
        run: |
          missing=()
          [ -z "${{ secrets.VPS_HOST }}" ]    && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_USER }}" ]    && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secret berikut belum diset di GitHub: ${missing[*]}"
            echo ""
            echo "Cara menambahkan:"
            echo "  GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ Semua secret tersedia"

      - name: Resolve deploy info
        id: info
        run: |
          branch="${{ github.event.inputs.target_branch }}"
          [ -z "$branch" ] && branch="main"
          force="${{ github.event.inputs.force_rebuild }}"
          skip_migrate="${{ github.event.inputs.skip_migrate }}"

          echo "branch=$branch"             >> "$GITHUB_OUTPUT"
          echo "force_rebuild=$force"       >> "$GITHUB_OUTPUT"
          echo "skip_migrate=$skip_migrate" >> "$GITHUB_OUTPUT"

          echo "🎯 Deploy info:"
          echo "  Branch       : $branch"
          echo "  Force rebuild: $force"
          echo "  Skip migrate : $skip_migrate"
          echo "  Target VPS   : ${{ secrets.VPS_HOST }}"

  # ─────────────────────────────────────────────────────────────────
  #  STEP 2 — Deploy ke VPS via SSH
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy ke VPS"
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: production-vps
      url: "http://${{ secrets.VPS_HOST }}"

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          # Tambah VPS ke known_hosts (skip host key checking hanya di CI)
          ssh-keyscan -p ${{ secrets.VPS_PORT || '22' }} \
            -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH key siap"

      - name: Test koneksi SSH
        run: |
          ssh -i ~/.ssh/vps_deploy_key \
            -p ${{ secrets.VPS_PORT || '22' }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo '✅ SSH konek berhasil. Server: $(hostname), Uptime: $(uptime -p)'"

      - name: Deploy ke VPS
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          FORCE_REBUILD: ${{ needs.prepare.outputs.force_rebuild }}
          SKIP_MIGRATE: ${{ needs.prepare.outputs.skip_migrate }}
        run: |
          ssh -i ~/.ssh/vps_deploy_key \
            -p ${{ secrets.VPS_PORT || '22' }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "BRANCH='${BRANCH}' FORCE_REBUILD='${FORCE_REBUILD}' SKIP_MIGRATE='${SKIP_MIGRATE}' \
             bash ~/app/scripts/deploy-vps.sh"

      - name: Health check semua service
        run: |
          VPS_HOST="${{ secrets.VPS_HOST }}"
          PORT="${{ secrets.VPS_APP_PORT || '80' }}"

          echo "🏥 Health check ke http://${VPS_HOST}:${PORT}/api/health"
          echo ""

          max_retries=8
          retry_delay=15
          success=false

          for i in $(seq 1 $max_retries); do
            echo "  Attempt $i/$max_retries..."
            http_code=$(curl -sS \
              -o /tmp/health-response.json \
              -w "%{http_code}" \
              --max-time 20 \
              --connect-timeout 10 \
              "http://${VPS_HOST}:${PORT}/api/health" 2>/dev/null || echo "000")

            if [ "$http_code" = "200" ]; then
              echo "  ✅ Health check passed (HTTP 200)"
              echo ""
              cat /tmp/health-response.json
              success=true
              break
            else
              echo "  ⚠️  HTTP $http_code — retry dalam ${retry_delay}s..."
              cat /tmp/health-response.json 2>/dev/null || true
              sleep $retry_delay
            fi
          done

          if [ "$success" = false ]; then
            echo "::error::❌ Health check gagal. Backend tidak merespons di http://${VPS_HOST}:${PORT}/api/health"
            exit 1
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_deploy_key

      - name: Tulis deployment summary
        if: always()
        run: |
          branch="${{ needs.prepare.outputs.branch }}"
          force="${{ needs.prepare.outputs.force_rebuild }}"

          {
            echo ""
            echo "## ✅ Deploy ke VPS Berhasil"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| 🌐 Target VPS | \`${{ secrets.VPS_HOST }}\` |"
            echo "| 🌿 Branch | \`$branch\` |"
            echo "| 🔨 Force rebuild | $force |"
            echo "| ⏰ Waktu | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| 👤 Dipicu oleh | @${{ github.actor }} |"
            echo ""
            echo "**Akses Aplikasi:**"
            echo "- 🌐 Web: http://${{ secrets.VPS_HOST }}"
            echo "- 🔌 API: http://${{ secrets.VPS_HOST }}/api"
            echo "- 📖 Docs: http://${{ secrets.VPS_HOST }}/api/docs"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
