# ==============================================
# docker-compose.dev.yml — Development Overrides
# Sewain — Kelompok Harahetta-2
#
# File ini TIDAK bisa dijalankan sendiri. Digunakan sebagai
# override di atas docker-compose.yml untuk environment development.
#
# Cara pakai:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Atau dengan Makefile:
#   make dev
#
# Fitur development mode:
#   - Hot-reload: kode langsung ter-reload tanpa rebuild image
#   - Port diekspose langsung ke host (tanpa gateway) untuk debugging
#   - Resource limits dikurangi (cocok untuk mesin lokal)
#   - Log level: DEBUG
#   - Database port tetap terbuka untuk koneksi langsung (misal DBeaver)
# ==============================================

services:
  # ================================
  # AUTH SERVICE — Dev Hot-Reload
  # ================================
  auth-service:
    build:
      context: ./services/auth-service
      target: development
    volumes:
      # Mount source code untuk hot-reload
      - ./services/auth-service:/app
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      SECRET_KEY: dev-secret-key-do-not-use-in-production
    # Override command: jalankan dengan --reload
    command:
      [
        "uvicorn", "main:app",
        "--host", "0.0.0.0",
        "--port", "8001",
        "--reload",
        "--reload-dir", "/app",
        "--log-level", "debug"
      ]
    # Expose port langsung ke host untuk debugging tanpa gateway
    ports:
      - "8001:8001"
    # Resource limits lebih rendah untuk dev
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ================================
  # ITEM SERVICE — Dev Hot-Reload
  # ================================
  item-service:
    build:
      context: ./services/item-service
      target: development
    volumes:
      - ./services/item-service:/app
