          memory: 128M

  # ================================
  # FRONTEND — Dev dengan Vite HMR
  # ================================
  frontend:
    # Untuk dev, jalankan Vite dev server (bukan build statis)
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      # Hindari override node_modules dari container
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost
      NODE_ENV: development
    # Vite dev server menggantikan build statis
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      # Vite HMR langsung di port 5173
      - "5173:5173"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 256M

  # ================================
  # DATABASES — Port expose untuk debugging
  # (Sudah terbuka di base compose, tidak perlu override)
  # ================================
  auth-db:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  item-db:
