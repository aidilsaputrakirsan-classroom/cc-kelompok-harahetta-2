# Tes lokal penuh: Postgres + FastAPI + frontend (Nginx).
# Kredensial DB harus sama dengan DATABASE_URL di backend/.env.docker
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: setiawan
      POSTGRES_DB: data_sewain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_sewain"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
    environment:
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: setiawan
      POSTGRES_DB: data_sewain
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
